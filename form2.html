<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>留言板</title>
</head>
<body style="background-color:white;">
    <div style="width:900px;margin:10px auto;background:white;padding:20px;">
        <!-- 顶部 -->
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2 style="color:blue;margin:0;">留言板</h2>
            <span style="color:blue;font-size:18px;">科技工作者建言</span>
        </div>
        <h4 style="color:red;margin:10px 0 15px 60px;">发表留言</h4>
        <form>
            <table style="margin-left:60px;">
                <tr>
                    <td align="right" style="color:green;padding:4px 8px;">姓 名：</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td align="right" style="color:green;padding:4px 8px;">电子邮件:</td>
                    <td><input type="text" style="width:420px;"></td>
                </tr>
                <tr>
                    <td align="right" style="color:green;padding:4px 8px;">分 类:</td>
                    <td>
                        <span style="color:red;">科技工作者建言</span>
                        <input type="radio" name="secret">
                        <span style="color:red;">不保密</span>
                        <input type="radio" name="secret">
                        <span style="color:red;">保密</span>
                        <span>留言类型：</span>
                        <select>
                            <option></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td align="right" style="color:green;padding:4px 8px;vertical-align:top;">留 言:</td>
                    <td><textarea rows="7" cols="55"></textarea></td>
                </tr>
            </table>
            <p style="font-size:15px;color:blue;text-align:center;margin:16px 0;">注：如果您的留言不便公开，请选择"保密"选项，提交后可凭系统反馈给您的留言编号、查询密码和您的姓名查询回复。</p>
            <div style="text-align:center;margin:10px 0;">
                <input type="submit" value="提交">
                <input type="reset" value="清空">
            </div>
            <ul style="font-size:15px;color:blue;padding-left:80px;margin-top:15px;">
                <li>请遵守国家有关法律、法规，尊重网上道德，承担一切因您的行为而直接或间接引起的法律责任。</li>
                <li>本网站拥有管理笔名和留言的一切权利。</li>
            </ul>
        </form>
    </div>
</body>
</html>
